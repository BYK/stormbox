name: Build BYK Cloudflare artifacts

on:
  push:
    branches: [agent/mail-rules-jmap-sieve]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: byk-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Verify and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/jmap-bridge/package-lock.json

      - name: Install application dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build webmail
        env:
          VITE_JMAP_SERVER_URL: https://jmap.byk.im
          VITE_APP_PASSWORD_ONLY: "1"
          VITE_ACCOUNTS_URL: https://accounts.tb.pro
          VITE_APPOINTMENT_URL: https://appointment.tb.pro
          VITE_SEND_URL: https://send.tb.pro
          VITE_SENDER_AVATAR_PROXY_URL: https://avatars.thunderbird.net
        run: npm run build

      - name: Install bridge dependencies
        run: npm ci --prefix infra/jmap-bridge

      - name: Build bridge bundle
        working-directory: infra/jmap-bridge
        run: >-
          npx wrangler deploy
          --config wrangler.byk.toml
          --dry-run
          --outdir ../../worker-dist

      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: byk-cloudflare-${{ github.sha }}
          path: |
            dist/
            worker-dist/
          if-no-files-found: error
          retention-days: 7
